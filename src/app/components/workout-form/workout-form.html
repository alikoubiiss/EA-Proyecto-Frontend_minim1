<h1>{{ id() ? 'Editar rutina' : 'Nueva rutina' }}</h1>

@if (error()) {
  <p class="alert">{{ error() }}</p>
}

@if (loading()) {
  <p class="muted">Cargando...</p>
} @else if (loadFailed()) {
  <a routerLink="/workouts">Volver a la lista de rutinas</a>
} @else {
  <form [formGroup]="form" (ngSubmit)="save()">
    <label>
      Nombre *
      <input type="text" formControlName="name" />
      @if (form.controls.name.touched && form.controls.name.invalid) {
        <small class="field-error">El nombre es obligatorio</small>
      }
    </label>

    <label>
      Día de la semana *
      <select formControlName="dayOfWeek">
        @for (day of days; track day) {
          <option [value]="day">{{ dayLabels[day] }}</option>
        }
      </select>
    </label>

    <label>
      Descripción
      <textarea formControlName="description" rows="3"></textarea>
    </label>

    <label>
      Ejercicios
      <select multiple formControlName="exercises">
        @for (exercise of exercises(); track exercise._id) {
          <option [value]="exercise._id">
            {{ exercise.name }} ({{ categoryLabels[exercise.category] }})
          </option>
        }
      </select>
      <small class="hint">Ctrl + clic para elegir varios</small>
    </label>

    <div class="form-actions">
      <button type="submit" [disabled]="form.invalid || saving()">
        {{ saving() ? 'Guardando...' : 'Guardar' }}
      </button>
      <a routerLink="/workouts">Cancelar</a>
    </div>
  </form>

  <!-- Historial de cambios de esta rutina: solo al editar, porque al crear todavía no hay cambios -->
  @if (id(); as workoutId) {
    <section class="history">
      <app-workout-changes-list
        [workoutId]="workoutId"
        [embedded]="true"
        (workoutReverted)="reloadWorkout()"
      />
    </section>
  }

  <app-confirm-modal
    [open]="confirmOpen()"
    [title]="id() ? '¿Guardar los cambios?' : '¿Crear rutina?'"
    [message]="id() ? 'Se modificarán los datos de la rutina.' : 'Se creará una rutina nueva.'"
    [confirmText]="id() ? 'Guardar' : 'Crear'"
    (confirmed)="confirmSave()"
    (cancelled)="cancelSave()"
  />
}
